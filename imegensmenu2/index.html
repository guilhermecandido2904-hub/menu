<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Imagem Transparente</title>

  <!-- IMPORTANTE: remove fundo branco -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      background: transparent;
      display: block;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 🔴 TROQUE AQUI PELO NOME DA SUA IMAGEM -->
    <img src="pandamenu3.png" alt="Imagem Transparente">
  </div>
</body>
</html>
